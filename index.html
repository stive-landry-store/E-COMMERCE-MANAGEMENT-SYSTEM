          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
          if (sessionStorage.getItem("sls-splash-v3")) document.documentElement.dataset.skipSplash = "1";
        } catch (e) {}
      })();
    </script>
    <style>
      html[data-skip-splash="1"] #boot-splash { display: none !important; }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(900px 600px at 50% 42%, rgba(255, 45, 149, 0.2), transparent 55%),
          #07051a;
        color: #fff;
        font-family: "Space Grotesk", Poppins, system-ui, sans-serif;
        transition: opacity 0.2s ease;
      }
      .boot-mark {
        position: relative;
        width: 11rem;
        height: 11rem;
        overflow: visible;
      }
      .boot-glow {
        position: absolute;
        inset: -30%;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(255, 45, 149, 0.55), rgba(255, 122, 69, 0.18) 45%, transparent 70%);
        opacity: 0;
        animation: boot-glow 1.2s ease-out 0.2s forwards;
      }
      .boot-logo {
        position: absolute;
        inset: 12%;
        overflow: hidden;
        border-radius: 9999px;
        opacity: 0;
        transform: scale(0.35) rotate(-25deg);
        filter: blur(14px);
        animation: boot-logo 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s forwards;
      }
      .boot-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .boot-logo::after {
        content: "";
        position: absolute;
        top: -10%;
        bottom: -10%;
        left: -60%;
        width: 40%;
        transform: skewX(-20deg);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent);
        animation: boot-shine 0.8s ease-in-out 0.75s forwards;
      }
      .boot-mark svg {
        position: absolute;
        inset: 0;
        transform: rotate(-90deg);
      }
      .boot-mark circle {
        fill: none;
        stroke: url(#boot-grad);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 302;
        stroke-dashoffset: 302;
        animation: boot-draw 0.9s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      .boot-name {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(50% + 7rem);
        text-align: center;
        font: 700 13px/1 Poppins, system-ui, sans-serif;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(10px);
        animation: boot-name 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
      }
      .boot-name b {
        background: linear-gradient(90deg, #ff7a45, #ff2d95, #c026d3);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @keyframes boot-logo { to { opacity: 1; transform: none; filter: blur(0); } }
      @keyframes boot-glow { 50% { opacity: 1; } to { opacity: 0.55; } }
      @keyframes boot-shine { to { left: 130%; } }
      @keyframes boot-name { to { opacity: 1; transform: none; } }
      .boot-splash-exit {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.45s ease 0.1s;
      }
      .boot-splash-exit .boot-mark {
        transform: scale(1.25);
        transition: transform 0.55s cubic-bezier(0.76, 0, 0.24, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo, .boot-mark circle, .boot-glow, .boot-name { animation: none; opacity: 1; transform: none; filter: none; stroke-dashoffset: 0; }
        .boot-logo::after { display: none; }
      }
    </style>

  <body>

        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="boot-grad" x1="0" x2="1">
              <stop offset="0" stop-color="#ff7a45" />
              <stop offset="0.5" stop-color="#ff2d95" />
              <stop offset="1" stop-color="#c026d3" />
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="48" />
        </svg>
        <div class="boot-logo"><img src="/logo.webp" alt="Stive Landry Store" width="160" height="160" /></div>
